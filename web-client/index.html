<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeviceBridge — Remote Device Control</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233B82F6'><rect x='3' y='3' width='7' height='7'/><rect x='14' y='3' width='7' height='7'/><rect x='14' y='14' width='7' height='7'/><rect x='3' y='14' width='7' height='7'/></svg>">
</head>
<body>
  <div id="app">
    <aside id="sidebar"></aside>
    <main id="content">
      <div id="loading" class="center-message">
        <div class="spinner"></div>
        <p style="color:var(--text-secondary);font-size:0.9rem;">Connecting to DeviceBridge...</p>
      </div>
    </main>
  </div>
  <div id="toast-container"></div>

  <!-- Connect Modal overlay for prompt-free entry -->
  <div id="connect-modal" style="display:none; position:fixed; inset:0; background:rgba(9,13,22,0.92); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:var(--bg-secondary, #111827); border:1px solid var(--border, #1e2d3d); border-radius:12px; padding:32px; width:90%; max-width:420px; box-shadow:0 8px 32px rgba(0,0,0,0.5);">
      <h2 style="color:#60a5fa; margin-bottom:6px; font-size:1.4rem;">DeviceBridge</h2>
      <p style="color:#94a3b8; margin-bottom:20px; font-size:0.85rem;">Enter your Target Device ID to start remote control.</p>
      
      <label style="display:block; color:#cbd5e1; font-size:0.8rem; margin-bottom:6px;">Device ID</label>
      <input type="text" id="connect-device-id" placeholder="e.g. db_a1b2c3d4" style="width:100%; padding:10px 12px; background:#0f1724; border:1px solid #1e2d3d; border-radius:6px; color:#fff; font-size:0.9rem; margin-bottom:16px; outline:none;">
      
      <label style="display:block; color:#cbd5e1; font-size:0.8rem; margin-bottom:6px;">Relay Server URL</label>
      <input type="text" id="connect-relay-url" style="width:100%; padding:10px 12px; background:#0f1724; border:1px solid #1e2d3d; border-radius:6px; color:#fff; font-size:0.9rem; margin-bottom:24px; outline:none;">
      
      <button id="connect-btn" style="width:100%; padding:12px; background:#2563eb; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:0.95rem;">Connect to Device</button>
    </div>
  </div>

  <!-- Core API & Components -->
  <script src="js/api.js"></script>
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/dashboard.js"></script>
  <script src="js/components/filemanager.js"></script>
  <script src="js/components/gallery.js"></script>
  <script src="js/components/terminal.js"></script>
  <script src="js/components/contacts.js"></script>
  <script src="js/components/notifications.js"></script>
  <script src="js/components/location.js"></script>
  <script src="js/components/camera.js"></script>
  <script src="js/components/applist.js"></script>
  <script src="js/components/controls.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
