<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ws: wss: http: https:; img-src 'self' data: https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>DeviceBridge — Remote Device Control</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233B82F6'><rect x='3' y='3' width='7' height='7'/><rect x='14' y='3' width='7' height='7'/><rect x='14' y='14' width='7' height='7'/><rect x='3' y='14' width='7' height='7'/></svg>">
  <!-- xterm.js terminal -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar"></aside>
    <main id="content">
      <div id="loading" class="center-message">
        <div class="spinner"></div>
        <p style="color:var(--text-secondary);font-size:0.9rem;">Connecting to DeviceBridge...</p>
      </div>
    </main>
  </div>
  <div id="toast-container"></div>

  <!-- Connect Modal overlay for prompt-free entry -->
  <div id="connect-modal" style="display:none; position:fixed; inset:0; background:rgba(9,13,22,0.92); z-index:9999; align-items:center; justify-content:center;">
    <div style="background:var(--bg-secondary, #111827); border:1px solid var(--border, #1e2d3d); border-radius:12px; padding:32px; width:90%; max-width:420px; box-shadow:0 8px 32px rgba(0,0,0,0.5);">
      <h2 style="color:#60a5fa; margin-bottom:6px; font-size:1.4rem;">DeviceBridge</h2>
      <p style="color:#94a3b8; margin-bottom:20px; font-size:0.85rem;">Secured Access Area.</p>
      <div id="login-form">
        <label style="display:block; color:#cbd5e1; font-size:0.8rem; margin-bottom:6px;">Web Client Password</label>
        <input type="password" id="connect-password" placeholder="Enter password" style="width:100%; padding:10px 12px; background:#0f1724; border:1px solid #1e2d3d; border-radius:6px; color:#fff; font-size:0.9rem; margin-bottom:24px; outline:none;">
        <button id="login-btn" style="width:100%; padding:12px; background:#2563eb; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:0.95rem;">Login</button>
      </div>
      <div id="device-select-form" style="display:none;">
        <label style="display:block; color:#cbd5e1; font-size:0.8rem; margin-bottom:6px;">Select Online Device</label>
        <select id="connect-device-id" style="width:100%; padding:10px 12px; background:#0f1724; border:1px solid #1e2d3d; border-radius:6px; color:#fff; font-size:0.9rem; margin-bottom:16px; outline:none;">
           <option value="">Loading online devices...</option>
        </select>
        <input type="hidden" id="connect-relay-url">
        <button id="connect-btn" style="width:100%; padding:12px; background:#10b981; color:#fff; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:0.95rem;">Connect to Device</button>
      </div>
    </div>
  </div>

  <!-- Core API & Components -->
  <script src="js/api.js?v=4"></script>
  <script src="js/components/sidebar.js?v=4"></script>
  <script src="js/components/dashboard.js?v=4"></script>
  <script src="js/components/filemanager.js?v=4"></script>
  <script src="js/components/gallery.js?v=4"></script>
  <script src="js/components/sms.js?v=4"></script>
  <script src="js/components/terminal.js?v=4"></script>
  <script src="js/components/contacts.js?v=4"></script>
  <script src="js/components/notifications.js?v=4"></script>
  <script src="js/components/location.js?v=4"></script>
  <script src="js/components/camera.js?v=4"></script>
  <script src="js/components/applist.js?v=4"></script>
  <script src="js/components/controls.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
